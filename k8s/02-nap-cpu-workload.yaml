apiVersion: apps/v1
kind: Deployment
metadata:
  name: nap-cpu-workload
  labels:
    app: nap-cpu-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nap-cpu-workload
  template:
    metadata:
      labels:
        app: nap-cpu-workload
    spec:
      containers:
      - name: compute-task
        image: busybox:1.36
        command: ["sh", "-c", "echo 'Workload started on dynamically provisioned node!'; sleep 3600"]
        resources:
          requests:
            # Request 3 vCPUs and 4Gi memory.
            # Default node is e2-standard-2 (~1.8 allocatable vCPU), so this CANNOT fit on default node.
            # GKE NAP will detect the unschedulable pod and provision a new node pool (e.g., e2-standard-4).
            cpu: "3000m"
            memory: "4Gi"
          limits:
            cpu: "3000m"
            memory: "4Gi"
