apiVersion: apps/v1
kind: Deployment
metadata:
  name: nap-spot-workload
  labels:
    app: nap-spot-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nap-spot-workload
  template:
    metadata:
      labels:
        app: nap-spot-workload
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      tolerations:
      - key: "cloud.google.com/gke-spot"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      containers:
      - name: spot-worker
        image: busybox:1.36
        command: ["sh", "-c", "echo 'Running on a Spot VM node pool created by NAP!'; sleep 3600"]
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
