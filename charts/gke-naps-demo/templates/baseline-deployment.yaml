{{- if .Values.baselineWorkload.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gke-naps-demo.fullname" . }}-baseline
  labels:
    {{- include "gke-naps-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: baseline-workload
spec:
  replicas: {{ .Values.baselineWorkload.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: baseline-workload
  template:
    metadata:
      labels:
        app.kubernetes.io/component: baseline-workload
    spec:
      containers:
      - name: web
        image: "{{ .Values.baselineWorkload.image.repository }}:{{ .Values.baselineWorkload.image.tag }}"
        imagePullPolicy: {{ .Values.baselineWorkload.image.pullPolicy }}
        resources:
          {{- toYaml .Values.baselineWorkload.resources | nindent 10 }}
        ports:
        - containerPort: 80
{{- end }}
