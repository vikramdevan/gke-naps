{{- if .Values.spotWorkload.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gke-naps-demo.fullname" . }}-spot-workload
  labels:
    {{- include "gke-naps-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: spot-workload
spec:
  replicas: {{ .Values.spotWorkload.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: spot-workload
  template:
    metadata:
      labels:
        app.kubernetes.io/component: spot-workload
    spec:
      {{- with .Values.spotWorkload.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.spotWorkload.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: spot-worker
        image: "{{ .Values.spotWorkload.image.repository }}:{{ .Values.spotWorkload.image.tag }}"
        imagePullPolicy: {{ .Values.spotWorkload.image.pullPolicy }}
        {{- if .Values.spotWorkload.command }}
        command:
          {{- toYaml .Values.spotWorkload.command | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .Values.spotWorkload.resources | nindent 10 }}
{{- end }}
