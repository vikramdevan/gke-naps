{{- if .Values.taintedWorkload.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gke-naps-demo.fullname" . }}-tainted-workload
  labels:
    {{- include "gke-naps-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: tainted-workload
spec:
  replicas: {{ .Values.taintedWorkload.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: tainted-workload
  template:
    metadata:
      labels:
        app.kubernetes.io/component: tainted-workload
    spec:
      {{- with .Values.taintedWorkload.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.taintedWorkload.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: batch-worker
        image: "{{ .Values.taintedWorkload.image.repository }}:{{ .Values.taintedWorkload.image.tag }}"
        imagePullPolicy: {{ .Values.taintedWorkload.image.pullPolicy }}
        {{- if .Values.taintedWorkload.command }}
        command:
          {{- toYaml .Values.taintedWorkload.command | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .Values.taintedWorkload.resources | nindent 10 }}
{{- end }}
