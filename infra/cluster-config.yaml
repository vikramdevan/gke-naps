# ==============================================================================
# GKE Cluster Infrastructure Configuration (Declarative Flags Specification)
#
# This file provides declarative configuration for provisioning the GKE cluster
# with Node Auto-Provisioning (NAP) enabled and strict cost-optimization rules.
#
# Provision command:
#   gcloud container clusters create naps-demo-cluster --flags-file=infra/cluster-config.yaml
# ==============================================================================

# Target GCP Project and Location
--project: "gke-naps"
#--zone: "us-central1-a"
--zone: "us-east1-b"

# Baseline Node Pool (1 VM of e2-standard-2)
--num-nodes: 1
--machine-type: "e2-standard-2"
#--spot: true

# Node Auto-Provisioning (NAP) Settings
--enable-autoprovisioning: true

# Autoscaling profile: optimize-utilization reduces scale-down delay from ~10 mins to ~3-5 mins
--autoscaling-profile: "optimize-utilization"

# Cluster-wide resource limits for auto-provisioned pools (Safety bounds)
--min-cpu: 1
--max-cpu: 8
--min-memory: 2
--max-memory: 32

# Cloud API scopes granted to auto-provisioned nodes
--autoprovisioning-scopes:
  - "https://www.googleapis.com/auth/cloud-platform"
